git:
  strategy: feature-branch
  base_branch: main
  protected_branches: main
  pull_request: true
  sync_remote_before_pr: true
  auto_merge: true
  merge_method: squash
  delete_branch_after_merge: true
  checkout_main_after_merge: true
  sync_remote_after_pr: true
  wait_for_merge: true
  auto_close_after_ship: true

verify:
  enabled: true
