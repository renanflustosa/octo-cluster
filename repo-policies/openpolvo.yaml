git:
  strategy: feature-branch
  base_branch: develop
  pull_request: true
  sync_remote_before_pr: true
  revalidate_after_rebase: true

verify:
  enabled: true
  commands:
    backend_build:
      cwd: openpolvobackend
      run: go build ./...
    backend_vet:
      cwd: openpolvobackend
      run: go vet ./...