git:
  strategy: feature-branch
  base_branch: main
  protected_branches: main
  pull_request: true
  sync_remote_before_pr: true
  auto_merge: true
  merge_method: squash
  delete_branch_after_merge: true
  checkout_main_after_merge: true

verify:
  enabled: true
  commands:
    install:
      run: pnpm install --frozen-lockfile
    prisma_generate:
      run: pnpm db:generate
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    build:
      run: pnpm build
