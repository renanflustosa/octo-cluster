git:
  strategy: feature-branch
  base_branch: develop
  protected_branches: main,develop
  pull_request: true
  sync_remote_before_pr: true

verify:
  enabled: true
  commands:
    boundary_audit:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\boundary-audit.ps1
    context_engine:
      cwd: engine/context-engine
      run: bun run validate octo-cluster
    context_engine_seed_test:
      cwd: engine/context-engine
      run: bun test src/lib/ensure-profile-seed.test.ts
    core_no_allow_install:
      run: powershell -NoProfile -Command "if (Select-String -Path domains\core\scripts\*.ps1 -Pattern AllowInstall -Quiet) { Write-Error 'AllowInstall in core scripts'; exit 1 }"
    scan_discover:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\invoke-pipeline.ps1 -Pipeline scan -Action discover
    bootstrap_allsigned:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-bootstrap-allsigned.ps1
