version: 1
project: octo-cluster

read_order:
  - AGENTS.md
  - contexts/context-index.yaml

tiers:
  permanent:
    priority: 1
    required: true
    paths:
      - contexts/permanent/framework-overview.md
      - docs/architecture/context-model.md
  operational:
    priority: 2
    required: false
    paths:
      - contexts/operational/agent-loop.md
      - contexts/runtime/*.json
  temporary:
    priority: 3
    required: false
    auto_load: false
    paths:
      - contexts/temporary/**

runtime:
  directory: contexts/runtime
  env_var: AI_EXECUTION_CONTEXT
  default_id: platform

never_auto_load:
  - state/**
  - contexts/temporary/**
  - engine/context-engine/node_modules/**
  - "**/.cache/**"
  - generated/**
  - capabilities/_private/**
  - domains/_private/**
  - contexts/_private/**
  - docs/_private/**
  - .git/**

index_exclusions_source: .aiignore
