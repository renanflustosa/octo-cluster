name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Public framework boundary audit
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/boundary-audit.ps1
