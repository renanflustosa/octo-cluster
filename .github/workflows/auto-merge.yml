name: Auto-merge bot PRs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review
  check_suite:
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Resolve bot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.user.type }}" != "Bot" ]; then
              echo "Human PR — skip"
              exit 0
            fi
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR=$(echo '${{ toJson(github.event.check_suite.pull_requests) }}' | jq -r '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No PR in check_suite — skip"
            exit 0
          fi

          IS_BOT=$(gh pr view "$PR" --json author --jq '.author.is_bot')
          if [ "$IS_BOT" != "true" ]; then
            echo "PR #$PR is not from a bot — skip"
            exit 0
          fi

          BASE=$(gh pr view "$PR" --json baseRefName --jq -r '.baseRefName')
          if [ "$BASE" != "main" ]; then
            echo "PR #$PR base is $BASE — skip"
            exit 0
          fi

          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR="${{ steps.pr.outputs.number }}"

          read -r PR_STATE MERGEABLE HAS_AUTO <<< "$(gh pr view "$PR" \
            --json state,mergeable,autoMergeRequest \
            --jq '[.state, .mergeable, (.autoMergeRequest != null)] | @tsv')"

          if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR #$PR already $PR_STATE — skip"
            exit 0
          fi

          if [ "$HAS_AUTO" = "true" ]; then
            echo "Auto-merge already enabled on PR #$PR — skip"
            exit 0
          fi

          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "PR #$PR has conflicts — skip auto-merge"
            exit 0
          fi

          FAILED=$(gh pr view "$PR" --json statusCheckRollup \
            --jq '[.statusCheckRollup[]? | select(.name != "auto-merge") | select(.conclusion == "FAILURE" or .state == "FAILURE")] | length')
          if [ "$FAILED" != "0" ]; then
            echo "PR #$PR has failing checks — skip auto-merge"
            exit 0
          fi

          gh pr merge "$PR" --auto --squash
          echo "Auto-merge enabled for PR #$PR (GitHub queues merge until required checks pass)"
