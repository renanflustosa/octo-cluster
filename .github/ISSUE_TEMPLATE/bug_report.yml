name: Community bug report
description: Report a harness bug or unexpected behavior.
title: "[bug] "
labels:
  - Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Octo Cluster. Include reproduction steps and environment details below.
        For feature ideas, open a general issue instead of this template.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, IDE adapter (e.g. Cursor), octo-cluster version or commit
      placeholder: Windows 11, Cursor, develop @ abc1234
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: textarea
    id: discover
    attributes:
      label: Pipeline discover output (optional)
      description: Output of `invoke-pipeline.ps1 -Pipeline scan -Action discover`
      render: shell
