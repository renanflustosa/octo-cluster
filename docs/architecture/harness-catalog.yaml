# Harness tool catalog (Octo Cluster)
# Taxonomy: ctx | search | compress | eval | cost | gate | ide
# status: on = default today | off = available but disabled | defer = not wired as default
# See ADR-006 and docs/guides/harness-tool-cluster.md

version: 1
platform: win11-cursor
adapter: cursor

tools:
  - id: memory-current-task
    class: ctx
    status: on
    path: state/memory/<profile>/current_task.md
    toggle: harness_tools.memory_files

  - id: lancedb-context-engine
    class: ctx
    status: on
    path: engine/context-engine/
    toggle: harness_tools.lancedb

  - id: okf-offline-index
    # sessionStart injection stays deferred (ADR-005)
    class: ctx
    status: defer
    path: eval/okf-session-poc/build-okf-index.ps1
    toggle: harness_tools.okf_index
    note: ADR-005 — no sessionStart injection default

  - id: context-search
    class: search
    status: on
    path: domains/core/scripts/core-context-search.ps1
    toggle: harness_tools.context_search

  - id: read-gate
    class: search
    status: on
    path: domains/core/scripts (read-gate)
    toggle: harness_tools.read_gate

  - id: grep-first
    class: search
    status: on
    path: domains/core/rules (token economy)
    toggle: harness_tools.grep_first

  - id: caveman
    class: compress
    status: on
    path: domains/core/skills/caveman/
    toggle: harness_tools.caveman

  - id: ponytail-lite
    class: compress
    status: on
    path: domains/core/skills/ponytail-lite/
    toggle: harness_tools.ponytail

  - id: promptfoo
    class: eval
    status: on
    path: eval/promptfoo/
    toggle: harness_tools.promptfoo

  - id: agentic-score
    class: eval
    status: on
    path: eval/agentic/
    toggle: harness_tools.agentic_score

  - id: usage-baseline
    class: cost
    status: on
    path: eval/metrics/stamp-usage-baseline.ps1
    toggle: harness_tools.usage_baseline

  - id: card-lite
    class: cost
    status: on
    path: eval/metrics/measure-card-lite.ps1
    toggle: harness_tools.card_lite

  - id: metrics-report
    class: cost
    status: on
    path: eval/metrics/report.ps1
    toggle: harness_tools.metrics_report

  - id: boundary-audit
    class: gate
    status: on
    path: scripts/boundary-audit.ps1
    toggle: harness_tools.boundary_audit

  - id: validate-cursor-hooks
    class: gate
    status: on
    path: scripts/validate-cursor-hooks.ps1
    toggle: harness_tools.validate_hooks

  - id: productivity-audit
    class: gate
    status: on
    path: scripts/productivity-audit.ps1
    toggle: harness_tools.productivity_audit

  - id: repo-verify
    class: gate
    status: on
    path: capabilities/core/ship/providers/
    toggle: harness_tools.repo_verify

  - id: sync-cursor
    class: ide
    status: on
    path: scripts/sync-cursor.ps1
    toggle: harness_tools.sync_cursor

  - id: cursor-session-hooks
    class: ide
    status: defer
    path: domains/core/hooks/hooks.platform.json
    toggle: harness_tools.session_hooks
    note: Empty hooks; OKF sessionStart deferred (ADR-005)

out:
  - paid SaaS as sole token signal
  - OpenSRE / mega-brain runtime ports
  - fleet monitoring daemon in core
  - OKF sessionStart as platform default
