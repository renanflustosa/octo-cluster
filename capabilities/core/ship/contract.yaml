version: 1
phases:
  - discover
  - preflight
  - verification
  - gates
  - git
  - reviews
  - close

providers:
  verification: discovered
  gates: discovered
  reviews: discovered
  git: repository-policy
  close: discovered

verdicts:
  - READY
  - NEEDS FIXES
  - BLOCKED

output_max_lines: 8
verify_max_lines: 40

constraints:
  providers_must_not_override:
    - git
